openapi: 3.0.3

info:
  title: ORAXAI Integration API
  description: ORAXAI middleware entegrasyon servisleri
  version: "1.0.0"

servers:
  - url: https://wmsapi.oraxai.com
    description: Test

tags:
  - name: System
    description: Sistem servisleri
  - name: Material
    description: Malzeme (SKU_MASTER) servisleri
  - name: Customer
    description: Müşteri/Cari servisleri
  - name: Inbound
    description: Depo giriş (pre-advice) servisleri
  - name: Return
    description: İade (return) servisleri
  - name: Shipment
    description: Sevkiyat servisleri
  - name: Query
    description: Sorgu (query) servisleri

paths:
  /health:
    get:
      tags: [System]
      summary: Servis sağlık kontrolü
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /material:
    post:
      tags: [Material]
      summary: Material upsert
      description: sku_code üzerinden upsert eder.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericUpsertResponse"

  /customer:
    post:
      tags: [Customer]
      summary: Customer upsert
      description: customer_code üzerinden upsert eder.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericUpsertResponse"

  /company-warehouse:
    post:
      tags: [Company Warehouse]
      summary: Firmaya ait ambar upsert
      description: |
        Firmanın WMS dışındaki kendi ambarı — **ambar transferi talimatlarının
        hedefidir**. WMS'te ayrı bir tablo değildir; müşteri kaydı üzerinde
        "firmaya ait ambar" bayrağıyla tutulur ve müşteri listelerinde görünmez.

        **Kod kimliktir:** `warehouse_code` firma içinde benzersiz upsert
        anahtarıdır. Aynı kodla tekrar gönderim mevcut kaydı GÜNCELLER
        (`action: updated`), farklı kod YENİ ambar açar. Entegrasyondan kod
        değiştirilemez.

        **Silme yoktur.** Kapatmak için `status` alanına `"0"`, `"passive"`,
        `"inactive"` ya da `"false"` gönderin; bunların dışındaki her değer
        aktif sayılır.

        Ambar kodu bir müşteri koduyla aynı olabilir — kodlar ayrı alanlardır,
        çakışma hata değildir.

        Bu akışta GLN alanı yoktur: transfer çıkışları İTS ve irsaliye
        kapılarını atladığı için gölge kayıtta GLN boş tutulur.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWarehouseRequest"
            example:
              company_id: "1006"
              warehouse_code: "12345"
              warehouse_name: "Test Ambar"
              address: "test 1234"
              status: "active"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  warehouse_code: { type: string }
                  action:
                    type: string
                    enum: [created, updated, unchanged]
                  message_id: { type: string, format: uuid }
              example:
                success: true
                message: "Company warehouse created."
                warehouse_code: "12345"
                action: "created"
                message_id: "3f2b1c40-9a77-4c1e-9f0a-1c2d3e4f5a6b"
        "400":
          description: |
            Doğrulama hatası (error_code: missing_field). warehouse_name ve
            address boş GELEMEZ — yalnız boşluk göndermek de boş sayılır,
            alanlar kırpıldıktan sonra denetlenir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inbound-order:
    post:
      tags: [Inbound]
      summary: Inbound order create (pre-advice)
      description: |
        İlaç firması depoya ürün göndermeden önce depo giriş bilgisini iletir.
        invoice_number tekildir.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundOrderRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "409":
          description: Duplicate invoice_number

  /purchase-order:
    post:
      tags: [Inbound]
      summary: Purchase order create (satın alma siparişi)
      description: |
        Satın alma siparişi — mal depoya gelmeden ÖNCE açılır.
        Inbound (gerçekleşmiş alım) ile aynı yapıdadır ancak
        invoice_number, invoice_date, pts_transfer_id ve lot/tarih
        bilgileri BULUNMAZ (satın alma aşamasında lot henüz belli değildir).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseOrderRequest"
            example:
              company_id: "1006"
              warehouse_code: "1006"
              supplier_code: "SUP-001"
              order_number: "MMMEE2"
              items:
                - sku_code: "99999-TEST"
                  quantity: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /return-order:
    post:
      tags: [Return]
      summary: Return order create (iade bildirimi)
      description: |
        İlaç firması, fiziksel olarak iade deposuna alınan ürünler için
        her kalemin gideceği hedef depoyu bu endpoint ile bildirir.

        Hedef depo kodları:
        - 1006: Mamul Depo
        - 10062: Karantina Depo
        - 10063: Sekonder Depo
        - 10064: İade Depo
        - 10065: İmha Depo

        Her item kendi `warehouse_code` (hedef depo), `gtin`, `lot`, `quantity`
        ve seri numaraları (`serial_numbers`) ile gönderilir. `serial_numbers`
        listesinin uzunluğu `quantity` ile eşit olmalıdır.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnOrderRequest"
            example:
              company_id: "1006"
              return_id: "RET-2026-001234"
              invoice_number: "1111111"
              invoice_date: "2026-01-10"
              items:
                - warehouse_code: "1006"
                  sku_code: "1201-062"
                  gtin: "08699502270589"
                  lot: "FLB01813"
                  production_date: "2025-06-01"
                  expiry_date: "2027-06-01"
                  quantity: 2
                  serial_numbers: ["SN001", "SN002"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /shipment-order:
    post:
      tags: [Shipment]
      summary: Shipment order oluştur
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentOrderRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"

  # ---------------------------
  # QUERY SERVİSLERİ (YENİ)
  # ---------------------------

  /query/order/{order_number}:
    get:
      tags: [Query]
      summary: Order query (tek kayıt)
      description: order_number ile order event detayını getirir.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: order_number
          in: path
          required: true
          schema:
            type: string
          example: "326050"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderQueryResponse"
              example:
                company_id: "1006"
                data:
                  customer_code: "120.04.020"
                  items:
                    - lot_number: "R2329047"
                      quantity: 7800
                      sku: "1405-009"
                    - lot_number: "R2372048"
                      quantity: 9200
                      sku: "1405-009"
                    - lot_number: "9450000049-Q"
                      quantity: 3600
                      sku: "1201-111026"
                  order_type: "outbound"
                  pts_transfer_id: "11223456"
                  warehouse_code: "1006"
                entity_id: "54321"
                entity_type: "ORDER"
                event_key: "shipping"
                status: "completed"
                timestamp: "2024-01-15T10:30:00Z"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericErrorResponse"

  /query/purchase-order/{order_number}:
    get:
      tags: [Query]
      summary: Purchase order durum sorgusu
      description: |
        Satın alma siparişinin uçtan uca akıbetini TEK çağrıda döner:

        1. `status` — PO'nun WMS'teki durumu: `pending` | `converted` | `cancelled`
        2. `data.items` — sipariş kalemleri
        3. `data.inbound_order` — dönüşümden doğan giriş siparişi: durumu,
           durum tarihçesi ve kalem bazında GERÇEKLEŞEN miktar
           (`received_qty`), lot, son kullanma tarihi

        Dönüşümden doğan giriş siparişi PO ile AYNI numarayı taşır: WMS'in
        dönüşüm ekranı sipariş no ve referans no alanlarını PO numarasıyla
        doldurup kilitler. `data.inbound_order` dönüşüm yapılmadıysa `null`
        olur; dolduğunda siparişin durumunu, durum tarihçesini ve kalem
        bazında gerçekleşen miktarı verir.

        Bu uç YALNIZ WMS kaydını okur. "Mesajı aldınız mı, işlendi mi" sorusunun
        yeri ayrıdır: yazma cevabında dönen `message_id` ile
        `GET /v2/messages/{message_id}`. Kayıt burada görünüyorsa mesaj zaten
        işlenmiş demektir.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: order_number
          in: path
          required: true
          description: ERP'nin gönderdiği PO numarası.
          schema:
            type: string
          example: "PO-1006-TEST-001"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id: { type: string }
                  entity_type: { type: string, enum: ["PURCHASE_ORDER"] }
                  entity_id: { type: string }
                  event_key:
                    type: string
                    enum: [purchase_order_pending, purchase_order_converted,
                           purchase_order_cancelled]
                  status: { type: string }
                  timestamp: { type: string, format: date-time }
                  data: { type: object }
              example:
                company_id: "1006"
                entity_type: "PURCHASE_ORDER"
                entity_id: "PO-1006-TEST-001"
                event_key: "purchase_order_converted"
                status: "converted"
                timestamp: "2026-08-27T09:15:00Z"
                data:
                  order_number: "PO-1006-TEST-001"
                  warehouse_code: "1006"
                  supplier_code: "SUP-001"
                  created_at: "2026-08-25T07:00:00Z"
                  updated_at: "2026-08-27T09:15:00Z"
                  items:
                    - sku_code: "99999-TEST"
                      quantity: 200
                  inbound_order:
                    order_number: "GIR-2026-0042"
                    status: "completed"
                    created_at: "2026-08-27T09:15:00Z"
                    history:
                      - from: null
                        status: "awaiting_vehicle"
                        at: "2026-08-27T09:15:00Z"
                      - from: "awaiting_vehicle"
                        status: "receiving_in_progress"
                        at: "2026-08-27T10:02:11Z"
                      - from: "receiving_in_progress"
                        status: "completed"
                        at: "2026-08-27T11:40:03Z"
                    items:
                      - sku_code: "99999-TEST"
                        ordered_qty: 200
                        received_qty: 198
                        lot: "L-2026-08"
                        expiry_date: "2028-01-01"
        "404":
          description: |
            Bu numarayla satın alma siparişi bulunamadı
            (error_code: purchase_order_not_found). Gönderdiğiniz mesajın
            akıbetini GET /v2/messages/{message_id} ile sorgulayın.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/warehouse-transfer/{transfer_number}:
    get:
      tags: [Query]
      summary: Ambar transfer talimatı durum sorgusu
      description: |
        Transfer talimatının uçtan uca akıbetini TEK çağrıda döner:

        1. `status` — talimatın WMS'teki durumu: `pending` | `converted` | `cancelled`
        2. `data.items` — kalemler ve `lot_resolved` bayrağı
        3. `data.outbound_order` — dönüşümden doğan çıkış siparişi: durumu,
           durum tarihçesi ve kalem bazında TOPLANAN miktar (`picked_qty`)

        **`data.items[].lot_resolved` alanına dikkat edin.** Transfer
        kalemlerinde lot zorunludur ama WMS lot kayıtlarında bulunamayan lot
        REDDEDİLMEZ: kayıt kabul edilir, o kalem lota bağlanamaz ve talimat
        **çıkışa dönüştürülemez**. `false` görüyorsanız talimatın neden
        ilerlemediğinin cevabı budur; lot düzeltilince dönüşüm açılır.

        `data.outbound_order` dönüşüm yapılmadıysa `null` olur.

        Bu uç YALNIZ WMS kaydını okur. "Mesajı aldınız mı, işlendi mi" sorusunun
        yeri ayrıdır: yazma cevabında dönen `message_id` ile
        `GET /v2/messages/{message_id}`. Kayıt burada görünüyorsa mesaj zaten
        işlenmiş demektir.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: transfer_number
          in: path
          required: true
          description: ERP'nin gönderdiği transfer numarası (v1 alan adı transfer_no).
          schema:
            type: string
          example: "TR-2026-001"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id: { type: string }
                  entity_type: { type: string, enum: ["WAREHOUSE_TRANSFER"] }
                  entity_id: { type: string }
                  event_key:
                    type: string
                    enum: [warehouse_transfer_pending, warehouse_transfer_converted,
                           warehouse_transfer_cancelled]
                  status: { type: string }
                  timestamp: { type: string, format: date-time }
                  data: { type: object }
              example:
                company_id: "1006"
                entity_type: "WAREHOUSE_TRANSFER"
                entity_id: "TR-2026-001"
                event_key: "warehouse_transfer_pending"
                status: "pending"
                timestamp: "2026-08-27T12:00:00Z"
                data:
                  transfer_number: "TR-2026-001"
                  target_warehouse_code: "12345"
                  ship_date: "2026-09-01"
                  created_at: "2026-08-27T12:00:00Z"
                  updated_at: "2026-08-27T12:00:00Z"
                  items:
                    - sku_code: "1405-009"
                      quantity: 20
                      lot: "R2329047"
                      lot_resolved: true
                  outbound_order: null
        "404":
          description: |
            Bu numarayla transfer talimatı bulunamadı
            (error_code: warehouse_transfer_not_found). Gönderdiğiniz mesajın
            akıbetini GET /v2/messages/{message_id} ile sorgulayın.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/company-warehouse/{warehouse_code}:
    get:
      tags: [Query]
      summary: Firmaya ait ambar durum sorgusu
      description: |
        Ambarın WMS'teki güncel hali.

        Ana veri akışı olduğu için siparişteki gibi bir yaşam döngüsü yoktur;
        `status` yalnız `active` ya da `passive` döner. Silme olmadığı için
        kapatılan ambar kaybolmaz, `passive` olarak görünür.

        Bu uç YALNIZ WMS kaydını okur. "Mesajı aldınız mı, işlendi mi" sorusunun
        yeri ayrıdır: yazma cevabında dönen `message_id` ile
        `GET /v2/messages/{message_id}`. Kayıt burada görünüyorsa mesaj zaten
        işlenmiş demektir.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: warehouse_code
          in: path
          required: true
          schema:
            type: string
          example: "12345"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  company_id: { type: string }
                  entity_type: { type: string, enum: ["COMPANY_WAREHOUSE"] }
                  entity_id: { type: string }
                  event_key:
                    type: string
                    enum: [company_warehouse_active, company_warehouse_passive]
                  status: { type: string, enum: [active, passive] }
                  timestamp: { type: string, format: date-time }
                  data: { type: object }
              example:
                company_id: "1006"
                entity_type: "COMPANY_WAREHOUSE"
                entity_id: "12345"
                event_key: "company_warehouse_active"
                status: "active"
                timestamp: "2026-08-27T12:00:00Z"
                data:
                  warehouse_code: "12345"
                  warehouse_name: "Test Ambar"
                  address: "test 1234"
                  is_active: true
                  created_at: "2026-08-27T12:00:00Z"
                  updated_at: "2026-08-27T12:00:00Z"
        "404":
          description: |
            Bu kodla firmaya ait ambar bulunamadı
            (error_code: company_warehouse_not_found). Gönderdiğiniz mesajın
            akıbetini GET /v2/messages/{message_id} ile sorgulayın.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/list/order:
    get:
      tags: [Query]
      summary: Order list query (tarih aralığı ile)
      description: |
        Order event kayıtlarını listeler.
        start_date ve end_date opsiyoneldir. Format: YYYY-MM-DD
      security:
        - ApiKeyAuth: []
      parameters:
        - name: start_date
          in: query
          required: false
          description: Başlangıç tarihi (YYYY-MM-DD)
          schema:
            type: string
            format: date
          example: "2025-01-01"
        - name: end_date
          in: query
          required: false
          description: Bitiş tarihi (YYYY-MM-DD)
          schema:
            type: string
            format: date
          example: "2025-01-31"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListQueryResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /query/list/warehouse-transfer:
    get:
      tags: [Query]
      summary: Ambar transfer talimatı listesi (keşif)
      description: |
        Bir tarih aralığındaki transfer talimatlarını listeler. **Numarasını
        bilmediğiniz talimatları bulmak içindir**; ayrıntı için dönen
        `transfer_number` ile `/query/warehouse-transfer/{transfer_number}`
        çağrılır.

        **`origin` alanı bu ucun asıl sebebidir.** Talimat WMS'te operatör
        tarafından da açılabilir; o kayıttan sizin haberiniz olmaz. Liste
        kaynak tablodan okunduğu için ikisi de görünür:

        - `integration` — sizin gönderdiğiniz
        - `wms` — WMS içinde açılmış, sizde karşılığı yok

        `start_date` ve `end_date` BİRLİKTE verilir ya da hiç verilmez; aralık
        30 günü aşamaz. Parametresiz çağrıda son 30 gün döner. Sonuçlar
        `updated_at` azalan sırada, en çok 1000 kayıt.

        Not: `/query/list/order` ucundan farklı olarak burada varsayılan bir
        durum süzgeci YOKTUR — transferde `completed` diye bir durum yok.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: start_date
          in: query
          required: false
          description: Başlangıç. YYYY-MM-DD ya da RFC3339. end_date ile birlikte verilir.
          schema: { type: string, format: date }
          example: "2026-08-01"
        - name: end_date
          in: query
          required: false
          description: Bitiş. start_date ile birlikte verilir.
          schema: { type: string, format: date }
          example: "2026-08-27"
        - name: status
          in: query
          required: false
          description: Tek duruma süzer. Verilmezse tüm durumlar döner.
          schema:
            type: string
            enum: [pending, converted, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    transfer_number: { type: string }
                    status: { type: string, enum: [pending, converted, cancelled] }
                    event_key: { type: string }
                    target_warehouse_code: { type: string }
                    ship_date: { type: string, format: date }
                    origin:
                      type: string
                      enum: [integration, wms]
                      description: |
                        integration = sizin gönderdiğiniz, wms = WMS içinde
                        açılmış (sizde karşılığı yok).
                    created_at: { type: string, format: date-time }
                    updated_at: { type: string, format: date-time }
              example:
                - transfer_number: "10061RP0000004"
                  status: "pending"
                  event_key: "warehouse_transfer_pending"
                  target_warehouse_code: "12345"
                  ship_date: "2026-08-27"
                  origin: "integration"
                  created_at: "2026-08-27T10:58:11Z"
                  updated_at: "2026-08-27T10:58:11Z"
                - transfer_number: "10061RP0000009"
                  status: "converted"
                  event_key: "warehouse_transfer_converted"
                  target_warehouse_code: "12345"
                  ship_date: "2026-08-28"
                  origin: "wms"
                  created_at: "2026-08-27T13:40:00Z"
                  updated_at: "2026-08-27T14:05:00Z"
        "400":
          description: |
            Tarih kuralı ihlali (error_code: invalid_date ya da missing_field):
            aralık 30 günü aşıyor, start_date > end_date, ya da ikisinden
            yalnız biri verilmiş.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /query/stock/{warehouse_id}:
    get:
      tags: [Query]
      summary: Stock query (depo bazlı)
      description: warehouse_id ile depo stok durumunu getirir.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: warehouse_id
          in: path
          required: true
          schema:
            type: string
          example: "T1006"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockQueryResponse"
              example:
                stock_status:
                  available:
                    description: "Available for shipment"
                    items:
                      - lot_number: "9450000050"
                        quantity: 960
                        sku: "1201-111024"
                    total_items: 1
                    total_quantity: 960
                  quarantine:
                    description: "In quarantine area (Quality Hold / Blocked / Return / Disposal)"
                    items:
                      - lot_number: "R2329047"
                        quantity: 7800
                        sku: "1405-009"
                    total_items: 1
                    total_quantity: 7800
                  staging:
                    description: "In staging area, ready for shipment"
                    items:
                      - lot_number: "R2347031-R"
                        quantity: 1200
                        sku: "1405-008"
                    total_items: 1
                    total_quantity: 1200
                  unconfirmed:
                    description: "Received but not yet confirmed or approved"
                    items:
                      - lot_number: "UC-20241230-01"
                        quantity: 5400
                        sku: "1501-002"
                    total_items: 1
                    total_quantity: 5400
                summary:
                  grand_total_quantity: 15360
                  total_available_quantity: 960
                  total_quarantine_quantity: 7800
                  total_staging_quantity: 1200
                  total_unconfirmed_quantity: 5400
                type: "STOCK"
                updated_at: "2025-01-01T13:45:00Z"
                warehouse_id: "T1006"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    MaterialRequest:
      type: object
      required: [company_id, material_name, sku_code, gtin, manufacturer]
      properties:
        company_id:
          type: string
          enum: ["T1006"]
        material_name:
          type: string
        sku_code:
          type: string
        alternate_sku_code:
          type: string
          nullable: true
        barcode_number:
          type: string
          nullable: true
        gtin:
          type: string
        category:
          type: integer
          nullable: true
        packaging_type:
          type: integer
          nullable: true
        base_unit:
          type: integer
          nullable: true
        manufacturer:
          type: string
        shelf_life:
          type: integer
          nullable: true
        shelf_life_unit:
          type: integer
          nullable: true
        units_per_pallet:
          type: integer
          nullable: true
        units_per_box:
          type: integer
          nullable: true
        unit_weight_bundle:
          type: number
          nullable: true
        external_attributes:
          type: object
          nullable: true
          additionalProperties: true

    CustomerRequest:
      type: object
      required:
        - company_id
        - customer_code
        - customer_name
        - customer_short_name
        - address
        - status
      properties:
        company_id:
          type: string
          enum: ["T1006"]
        customer_code:
          type: string
        customer_name:
          type: string
        customer_short_name:
          type: string
        address:
          type: string
        gln:
          type: string
          nullable: true
        status:
          type: integer
        shipto_addresses:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ShipToAddress"
        external_attributes:
          type: object
          nullable: true
          additionalProperties: true

    ShipToAddress:
      type: object
      required: [shipto_code, shipto_name, address, status]
      properties:
        shipto_code:
          type: string
        shipto_name:
          type: string
        address:
          type: string
        shipto_gln:
          type: string
          nullable: true
        status:
          type: integer
        external_attributes:
          type: object
          nullable: true
          additionalProperties: true

    ErrorResponse:
      type: object
      description: |
        Ortak hata zarfı — core::error::AppError bütün 4xx/5xx cevaplarını
        bu şekilde döner. `errors[]` alan bazlı listedir, `error_code` makine
        okur özet koddur, `trace_id` sunucu loglarıyla eşleştirmek içindir.
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation Error"
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        error_code:
          type: string
          example: "missing_field"
        trace_id:
          type: string
          format: uuid

    CompanyWarehouseRequest:
      type: object
      required:
        - company_id
        - warehouse_code
        - warehouse_name
        - address
        - status
      properties:
        company_id:
          type: string
          description: "API anahtarının firmasıyla eşleşmelidir."
        warehouse_code:
          type: string
          description: |
            Firma içinde benzersiz upsert anahtarı. Kaydın kimliğidir;
            entegrasyondan değiştirilemez, farklı kod yeni ambar açar.
        warehouse_name:
          type: string
          description: "Boş gelemez."
        address:
          type: string
          description: |
            ZORUNLU, boş gelemez — ambar "Adrese Teslimat" hedefidir ve
            transfer çıkışının sevk adresi budur. (Müşteri akışının aksine
            burada adres opsiyonel DEĞİLDİR.)
        status:
          type: string
          description: |
            "0", "passive", "inactive", "false" → pasif; bunların dışındaki
            her değer aktif sayılır.
          example: "active"

    InboundOrderRequest:
      type: object
      required:
        - company_id
        - warehouse_code
        - invoice_number
        - invoice_date
        - order_number
        - items
      properties:
        company_id:
          type: string
          enum: ["T1006"]
        warehouse_code:
          type: string
          enum: ["T1006"]
        supplier_code:
          type: string
          nullable: true
          description: "Opsiyonel. Tedarikçi (cari) kodu."
          example: "SUP-001"
        invoice_number:
          type: string
        invoice_date:
          type: string
          format: date
        order_number:
          type: string
        pts_transfer_id:
          type: string
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InboundOrderItem"

    InboundOrderItem:
      type: object
      required:
        - sku_code
        - quantity
        - lot
        - production_date
        - expiry_date
      properties:
        sku_code:
          type: string
          description: |
            WMS'te tanımlı malzeme kodu. Firmanın malzeme kartlarında yoksa
            istek reddedilir: HTTP 400, error_code = material_not_found ve
            errors[] içinde eksik olan her kalem items[i].sku_code alanıyla
            tek tek listelenir. Eşleşme YALNIZ sku_code iledir,
            alternate_sku_code ile değil.
            Yeni malzeme /material ile açıldıysa WMS'e işlenmesi birkaç
            saniye sürer; aynı SKU'yu hemen sipariş kaleminde göndermek bu
            pencerede material_not_found alabilir.
        quantity:
          type: number
          description: "Miktar. Ondalıklı olabilir. Sayı ya da string olarak gönderilebilir; string'de virgül de kabul edilir ('12,5' → 12.5)."
        lot:
          type: string
        production_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date

    PurchaseOrderRequest:
      type: object
      required:
        - company_id
        - warehouse_code
        - order_number
        - items
      properties:
        company_id:
          type: string
          enum: ["T1006"]
        warehouse_code:
          type: string
          enum: ["T1006"]
        supplier_code:
          type: string
          nullable: true
          description: "Opsiyonel. Tedarikçi (cari) kodu."
          example: "SUP-001"
        order_number:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"

    PurchaseOrderItem:
      type: object
      required:
        - sku_code
        - quantity
      properties:
        sku_code:
          type: string
          description: |
            WMS'te tanımlı malzeme kodu. Firmanın malzeme kartlarında yoksa
            istek reddedilir: HTTP 400, error_code = material_not_found ve
            errors[] içinde eksik olan her kalem items[i].sku_code alanıyla
            tek tek listelenir. Eşleşme YALNIZ sku_code iledir,
            alternate_sku_code ile değil.
            Yeni malzeme /material ile açıldıysa WMS'e işlenmesi birkaç
            saniye sürer; aynı SKU'yu hemen sipariş kaleminde göndermek bu
            pencerede material_not_found alabilir.
        quantity:
          type: number
          description: "Miktar. Ondalıklı olabilir. Sayı ya da string olarak gönderilebilir; string'de virgül de kabul edilir ('12,5' → 12.5)."

    ReturnOrderRequest:
      type: object
      required:
        - company_id
        - return_id
        - invoice_number
        - invoice_date
        - items
      properties:
        company_id:
          type: string
          enum: ["1006"]
        return_id:
          type: string
          description: "Firma tarafından üretilen iade referans numarası."
          example: "RET-2026-001234"
        invoice_number:
          type: string
        invoice_date:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReturnOrderItem"

    ReturnOrderItem:
      type: object
      required:
        - warehouse_code
        - sku_code
        - gtin
        - lot
        - production_date
        - expiry_date
        - quantity
        - serial_numbers
      properties:
        warehouse_code:
          type: string
          description: "Bu kalemin alınacağı hedef depo kodu."
          oneOf:
            - title: "1006 - Mamul Depo"
              enum: ["1006"]
            - title: "10062 - Karantina Depo"
              enum: ["10062"]
            - title: "10063 - Sekonder Depo"
              enum: ["10063"]
            - title: "10064 - İade Depo"
              enum: ["10064"]
            - title: "10065 - İmha Depo"
              enum: ["10065"]
          example: "1006"
        sku_code:
          type: string
        gtin:
          type: string
          description: "SKU için kayıtlı GTIN."
          example: "08699502270589"
        lot:
          type: string
        production_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
        quantity:
          type: number
          description: "Bu kalemdeki birim sayısı. serial_numbers uzunluğu ile eşit olmalı."
          example: 2
        serial_numbers:
          type: array
          minItems: 1
          description: "Karekod seri numaraları. Uzunluğu quantity ile eşit olmalı."
          items:
            type: string
          example: ["SN001", "SN002"]

    ShipmentOrderRequest:
      type: object
      required:
        - company_id
        - order_number
        - customer_id
        - shipto_code
        - order_date
        - warehouse_id
        - items
      properties:
        company_id:
          type: string
          enum: ["T1006"]
        order_number:
          type: string
        order_ref_number:
          type: string
          nullable: true
        customer_id:
          type: string
        shipto_code:
          type: string
        order_date:
          type: string
          format: date
        warehouse_id:
          type: string
          enum: ["T1006"]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ShipmentOrderItem"

    ShipmentOrderItem:
      type: object
      required: [sku, lot, qty]
      properties:
        sku:
          type: string
          description: |
            WMS'te tanımlı malzeme kodu. Firmanın malzeme kartlarında yoksa
            istek reddedilir: HTTP 400, error_code = material_not_found ve
            errors[] içinde eksik olan her kalem items[i].sku_code alanıyla
            tek tek listelenir. Eşleşme YALNIZ sku_code iledir,
            alternate_sku_code ile değil.
            Yeni malzeme /material ile açıldıysa WMS'e işlenmesi birkaç
            saniye sürer; aynı SKU'yu hemen sipariş kaleminde göndermek bu
            pencerede material_not_found alabilir.
        lot:
          type: string
        qty:
          type: number
          description: "Miktar. Ondalıklı olabilir. Sayı ya da string olarak gönderilebilir; string'de virgül de kabul edilir ('12,5' → 12.5)."

